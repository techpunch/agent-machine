# Managed by the agent-machine cookbook. have-shared-sandbox applies it with `sbx create --kit <path>`
# on top of the built-in claude agent.
#
# A kit is the supported way to give a sandbox the same defaults every time, and it is a committed
# file, which is what this repo wants: what the agents are told, what is installed beside Claude
# Code and the Codex sign-in are reviewable here rather than living in one machine's local state.
#
# Schema v2, because v1 cannot declare a credential the way Docker's own agent kits do. The Codex
# parts are copied from Docker's codex kit, docker/sbx-kits-contrib codex/spec.yaml and
# codex/Dockerfile; when that kit changes, compare against it rather than reasoning from scratch.
schemaVersion: "2"
kind: mixin
name: agent-machine
displayName: agent-machine defaults
description: Codex beside Claude Code, both kept current, and how to work in this sandbox.
requires:
  agent: claude

# The Codex sign-in, verbatim from Docker's codex kit. The OAuth block is what keeps the real token
# on the Mac: the proxy intercepts the token response from auth.openai.com, hands the sandbox the
# sentinels below, and swaps the real token back in on requests to chatgpt.com. Never add
# `passthrough: true` — it sends the real token into the sandbox.
#
# A kit that is not built into sbx needs an approved binding before sbx will use this, and with
# nobody at the screen sbx withholds the credential silently instead of asking. have-shared-sandbox
# writes that binding before it creates the sandbox.
credentials:
  - service: openai
    apiKey:
      name: OPENAI_API_KEY
      inject:
        - domain: api.openai.com
          header: Authorization
          format: Bearer %s
        - domain: openai.com
          header: Authorization
          format: Bearer %s
    oauth:
      tokenEndpoint:
        host: auth.openai.com
        path: /oauth/token
      resourceHosts:
        - chatgpt.com
      sentinels:
        accessToken: oai-oat01-proxy-managed
        refreshToken: oai-ort01-proxy-managed

permissions:
  network:
    # Every domain a credential is injected into has to be allowed here, whatever the preset. The
    # Codex hosts are the codex kit's list. The documentation hosts only matter under a preset
    # stricter than allow-all — `balanced` covers AI APIs, package managers, code hosts and
    # registries, and these are the docs it does not. Curate them: documentation and package hosts
    # earn a place, telemetry and analytics do not.
    allow:
      - api.openai.com
      - openai.com
      - auth.openai.com
      - chatgpt.com
      - files.openai.com
      - "*.chatgpt.com"
      - "*.oaiusercontent.com"
      - releases.openai.com
      - developer.mozilla.org
      - docs.python.org
      - "*.readthedocs.io"
      - pkg.go.dev
      - docs.rs
      - developer.apple.com
      - man7.org

environment:
  variables:
    CODEX_HOME: /home/agent/.codex
    # From Docker's codex kit: a 401 from GitHub (a missing or expired token) otherwise makes git open
    # the terminal to ask for a username, which hangs an agent. "0" makes it fail and say so.
    GIT_TERMINAL_PROMPT: "0"

setup:
  install:
    # tmux for the agent grid; its config is files/home/.tmux.conf beside this file. Nothing is
    # needed for bypass mode in a pane: Docker's claude kit seeds permissions.defaultMode
    # bypassPermissions into ~/.claude/settings.json, and the Codex config below sets
    # approval_policy "never" and sandbox_mode "danger-full-access", so a plain `claude` or `codex`
    # starts that way however it was launched.
    - command: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -q
        apt-get install -y -q --no-install-recommends tmux
        rm -rf /var/lib/apt/lists/*
      user: "0"
      description: Install tmux
    # The install line from Docker's codex Dockerfile. It installs the current release into
    # ~/.local/bin, where Claude Code's installer also puts `claude`, and links it onto the PATH the
    # image uses for agents, as that Dockerfile does.
    - command: |
        set -e
        mkdir -p /home/agent/.codex
        CODEX_INSTALL_DIR=/home/agent/.local/bin CODEX_NON_INTERACTIVE=true \
          sh -c "$(curl -fsSL https://chatgpt.com/codex/install.sh)"
        /home/agent/.local/bin/codex --version
        mkdir -p /usr/local/share/npm-global/bin
        ln -sf /home/agent/.local/bin/codex /usr/local/share/npm-global/bin/codex
      user: "1000"
      description: Install the Codex CLI
    # Verbatim from Docker's codex kit, which seeds Codex's config from how the openai credential
    # resolved: under OAuth, Codex talks to chatgpt.com through the proxy with the sentinel.
    - command: |
        set -e
        mkdir -p /home/agent/.codex /home/agent/.agents
        MODE="${SBX_CRED_OPENAI_MODE:-none}"
        cat > /home/agent/.codex/config.toml << 'EOF'

        approval_policy = "never"
        sandbox_mode = "danger-full-access"
        mcp_oauth_credentials_store = "file"
        EOF
        case "$MODE" in
          oauth|apikey)
            cat >> /home/agent/.codex/config.toml << 'EOF'
        forced_login_method = "api"
        EOF
            ;;
        esac
        if [ "$MODE" = oauth ]; then
          cat >> /home/agent/.codex/config.toml << 'EOF'

        model_provider = "sandboxd"

        [model_providers.sandboxd]
        name = "Sandbox Proxy"
        base_url = "https://chatgpt.com/backend-api/codex"
        experimental_bearer_token = "oai-oat01-proxy-managed"
        requires_openai_auth = false
        EOF
        fi
        case "$MODE" in
          oauth|apikey)
            cat > /home/agent/.codex/auth.json << 'EOF'
        {
          "OPENAI_API_KEY": "proxy-managed"
        }
        EOF
            ;;
          *)
            rm -f /home/agent/.codex/auth.json
            ;;
        esac
      user: "1000"
      description: Seed Codex config/auth from SBX_CRED_OPENAI_MODE
  startup:
    # The sandbox lives for months and its image was current only on the day it was pulled. This
    # brings both agents to their latest release every time the sandbox starts — after a reboot,
    # in practice — in the background, so a slow download never holds up a session. `claude update`
    # is Claude Code's own updater. `codex update` re-runs Codex's standalone installer, per Docker's
    # codex kit; the installer is called directly here so the install directory and the
    # non-interactive flag are explicit rather than inherited. Both converge, so running them every
    # start is harmless.
    - command:
        - sh
        - -c
        - |
          export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
          {
            claude update
            CODEX_INSTALL_DIR="$HOME/.local/bin" CODEX_NON_INTERACTIVE=true \
              sh -c "$(curl -fsSL https://chatgpt.com/codex/install.sh)"
          } >/dev/null 2>&1 </dev/null
      user: "1000"
      background: true
      description: Update Claude Code and Codex to their latest releases

# What the agents are told is not here but in files/home/.codex/AGENTS.md, which Codex reads as its
# global instructions and files/home/.claude/CLAUDE.md imports for Claude Code. A mixin's
# agentInstructions would go beside the profile sbx generates next to a mounted workspace — this
# sandbox mounts none — and Codex does not read that profile at all (docker/sbx-releases#567).
