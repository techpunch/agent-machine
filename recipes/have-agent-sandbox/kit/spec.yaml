# Managed by the agent-machine cookbook. Applied with `sbx run --kit <path> ...`.
#
# A kit is the supported way to give every sandbox the same defaults, and it is a committed file,
# which is what this repo wants: the allowlist and the agent guidance are reviewable and travel with
# the recipe rather than living in one machine's local policy store.
schemaVersion: "1"
kind: mixin
name: agent-machine
displayName: agent-machine defaults
description: Denial-reporting guidance and a starter documentation allowlist.

network:
  # `balanced` already covers AI provider APIs, package managers, code hosts and registries. These
  # are the documentation hosts it does not, and without them an agent works from memory.
  #
  # Curate this. Documentation and package hosts earn a place; telemetry and analytics do not. If a
  # single task needs a dozen more, scope them to that sandbox with
  # `sbx policy allow network <domain> --sandbox <name>` rather than widening the baseline here.
  allowedDomains:
    - developer.mozilla.org
    - docs.python.org
    - "*.readthedocs.io"
    - pkg.go.dev
    - docs.rs
    - developer.apple.com
    - man7.org

# Appended to the agent's memory. Kits cannot write ~/.claude/CLAUDE.md directly — sandboxes seed
# that path during setup and would overwrite it — so agentContext is the supported route.
agentContext: |
  ## Say when the network blocked you

  This sandbox has deny-by-default network egress. A request that fails with `403` and
  `Blocked by network policy` was refused by this machine's policy, not by the site.

  When that happens:

  - Stop and say so. Name the exact domain from the error and what you wanted from it.
  - Do not answer from memory instead, and do not quietly try a different source.

  An answer built on recalled documentation looks confident and is often wrong about current APIs.
  Telling me you could not reach the docs is the better outcome every time, because it costs me one
  command to fix:

      sbx policy allow network <domain>

  If several domains were blocked during a task, list all of them at the end rather than only the
  first.

  A `404`, a timeout, or a connection error is an ordinary failure and needs none of this. Only
  `Blocked by network policy` does — that is the proxy refusing, and it is the one I can fix.
