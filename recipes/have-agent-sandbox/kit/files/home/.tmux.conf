# Managed by the agent-machine cookbook (recipes/have-agent-sandbox/kit). Edits are lost when the
# sandbox is recreated.
#
# Defaults chosen for watching agents rather than for editing: a long scrollback because an agent
# can outrun the default 2000 lines in one task, and mouse mode so scrolling a pane over SSH does
# not mean learning copy-mode first.
#
# The terminal settings are not cosmetic. An SSH session that leaves TERM as xterm makes Claude
# Code's renderer degrade: box-drawing falls back to ASCII, colour drops to 8, and slash-command
# autocomplete renders as plain text above the prompt instead of inline.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-left "#[bold] #S "
set -g status-right " %H:%M "
setw -g automatic-rename on
